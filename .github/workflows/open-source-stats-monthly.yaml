# Fetches GitHub stars/forks for _data/open_source_projects.yaml, updates
# _data/open_source_github_stats.yaml + docs/open-source-projects.md, regenerates
# static HTML, and deploys branch `live` (GitHub Pages). Does not run full readme
# or Workable fetches.
#
# Schedule: 04:00 UTC on the 1st of each month. Manual: Actions → Run workflow.

name: Update open source GitHub stats

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up just
        uses: extractions/setup-just@v3
        with:
          just-version: "1.40.0"

      - name: Install Python and dependencies
        run: just sync --frozen

      - name: Set up Ruby (Jekyll site build)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "2.5.23"
          bundler-cache: true
          working-directory: jekyll-pages

      - name: Refresh open source stats, docs, and deploy site
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          deploy_live() {
            LIVE_MSG="$1"
            WORK="$(mktemp -d)"
            cp -a "${GITHUB_WORKSPACE}/jekyll-pages/." "${WORK}/"
            uv run python -m greek_software_ecosystem.jekyll_url_config > "${WORK}/_url.yml"
            for f in index.html employers.html job-search.html resources.html podcasts.html workspaces.html open-source.html; do
              cp "${GITHUB_WORKSPACE}/${f}" "${WORK}/"
            done
            mkdir -p "${WORK}/assets/css" "${WORK}/assets/js" "${WORK}/assets/vendor/leaflet"
            cp "${GITHUB_WORKSPACE}/assets/css/index.css" "${WORK}/assets/css/"
            cp "${GITHUB_WORKSPACE}/assets/js/analytics-consent.js" "${GITHUB_WORKSPACE}/assets/js/index.js" "${GITHUB_WORKSPACE}/assets/js/open-source-search.js" "${GITHUB_WORKSPACE}/assets/js/resources-search.js" "${GITHUB_WORKSPACE}/assets/js/workspaces-page.js" "${GITHUB_WORKSPACE}/assets/js/site-chrome.js" "${GITHUB_WORKSPACE}/assets/js/tailwind-config.js" "${WORK}/assets/js/"
            cp -R "${GITHUB_WORKSPACE}/assets/vendor/leaflet/." "${WORK}/assets/vendor/leaflet/"
            cp "${GITHUB_WORKSPACE}/assets/og-image.png" "${GITHUB_WORKSPACE}/assets/hub-icon.svg" "${GITHUB_WORKSPACE}/assets/vectorized.svg" "${WORK}/assets/"
            (
              cd "${WORK}"
              bundle install
              bundle exec jekyll build --config _config.yml,_url.yml
            )
            SITE="${WORK}/_site"
            cp "${GITHUB_WORKSPACE}/sitemap.xml" "${GITHUB_WORKSPACE}/robots.txt" "${SITE}/"
            touch "${SITE}/.nojekyll"
            (
              cd "${SITE}"
              git init -b live
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git config user.name "github-actions[bot]"
              git add -A
              git commit -m "${LIVE_MSG}"
              git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
              git push --force origin live
            )
            rm -rf "${WORK}"
          }

          just open-source-stats-update

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add _data/open_source_github_stats.yaml docs/open-source-projects.md
          MAIN_CHANGED=0
          if git diff --staged --quiet; then
            echo "No open source stats changes to commit on main."
          else
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              git commit -m "chore: refresh open source GitHub stats (manual) [skip ci]"
            else
              git commit -m "chore(📊): refresh open source GitHub stats [skip ci]"
            fi
            MAIN_CHANGED=1
          fi

          deploy_live "chore: deploy static site after open source stats refresh [skip ci]"

          if [ "$MAIN_CHANGED" -eq 1 ]; then
            git push origin main
          fi
